<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blush and bloom</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <main class="form-wrap">
    <h1>Book Your Appointment</h1>

    <form action="#" method="post">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Your name" required minlength="3" maxlength="40">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" maxlength="20">

        <label for="date">Preferred Date</label>
        <input type="date" id="date" name="date" required>

        <label for="time">Preferred Time</label>
        <input type="time" id="time" name="time" min="10:00" max="20:00">

        <label for="guests">Number of People</label>
        <input type="number" id="guests" name="guests" min="1" max="10" value="1">

        <label for="budget">Budget</label>
        <input type="range" id="budget" name="budget" min="5000" max="50000" step="1000">

        <label for="country">Country</label>
        <input type="text" id="country" name="country" value="Pakistan" readonly>

        <label for="service">Service</label>
        <select id="service" name="service">
            <option value="bridal">Bridal Makeup</option>
            <option value="party" selected>Party Makeup</option>
            <option value="skin">Skin Care</option>
        </select>

        <label for="photo">Reference Photo</label>
        <input type="file" id="photo" name="photo">

        <fieldset>
            <legend>Where should we do your makeup?</legend>
            <label><input type="radio" name="place" value="studio" checked> At the studio</label>
            <label><input type="radio" name="place" value="home"> At your home</label>
        </fieldset>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4" maxlength="200"></textarea>

        <label class="terms"><input type="checkbox" name="terms" required> I agree to the terms</label>

        <button type="submit">Book Now</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 Blush and Bloom. All rights reserved.</p>
</footer>
</body>
</html>
